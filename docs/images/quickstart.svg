<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arrowSky2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrowGreen2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#34D399"/>
    </marker>
    <marker id="arrowPurple2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#C084FC"/>
    </marker>
    <marker id="arrowYellow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#FBBF24"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="950" height="480" rx="14" fill="url(#bgGrad2)" stroke="#1F2937" stroke-width="2"/>

  <!-- Actor Headers -->
  <!-- User -->
  <rect x="50" y="25" width="130" height="40" rx="6" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
  <text x="115" y="50" fill="#F8FAFC" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">👤 User</text>
  <line x1="115" y1="65" x2="115" y2="445" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Primary PC (Host) -->
  <rect x="250" y="25" width="180" height="40" rx="6" fill="#0C4A6E" stroke="#0284C7" stroke-width="1.5"/>
  <text x="340" y="50" fill="#38BDF8" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">🖥️ Primary PC (Host)</text>
  <line x1="340" y1="65" x2="340" y2="445" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Local Network -->
  <rect x="510" y="25" width="150" height="40" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="585" y="50" fill="#34D399" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">🔒 Local Wi-Fi / LAN</text>
  <line x1="585" y1="65" x2="585" y2="445" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Second Laptop (Client) -->
  <rect x="730" y="25" width="170" height="40" rx="6" fill="#581C87" stroke="#A855F7" stroke-width="1.5"/>
  <text x="815" y="50" fill="#C084FC" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">💻 Second Laptop</text>
  <line x1="815" y1="65" x2="815" y2="445" stroke="#A855F7" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Sequence Steps -->
  <!-- Step 1: User launches host -->
  <line x1="115" y1="100" x2="335" y2="100" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arrowSky2)"/>
  <text x="225" y="93" fill="#94A3B8" font-family="sans-serif" font-size="11" text-anchor="middle">1. Double-click run_host.bat</text>

  <!-- Step 2: Host binds socket -->
  <path d="M 340 115 L 375 115 L 375 135 L 345 135" fill="none" stroke="#0284C7" stroke-width="1.5" marker-end="url(#arrowSky2)"/>
  <text x="385" y="129" fill="#38BDF8" font-family="sans-serif" font-size="10">Starts TLS 1.3 Server (Displays IP)</text>

  <!-- Step 3: User launches client -->
  <line x1="115" y1="165" x2="810" y2="165" stroke="#C084FC" stroke-width="1.5" marker-end="url(#arrowPurple2)"/>
  <text x="460" y="158" fill="#94A3B8" font-family="sans-serif" font-size="11" text-anchor="middle">2. Double-click run_client.bat</text>

  <!-- Step 4: Client broadcast discovery -->
  <line x1="815" y1="200" x2="590" y2="200" stroke="#34D399" stroke-width="1.5" marker-end="url(#arrowGreen2)"/>
  <text x="700" y="193" fill="#A7F3D0" font-family="sans-serif" font-size="10" text-anchor="middle">Broadcast UDP Beacon (53891)</text>

  <!-- Step 5: Discovery response -->
  <line x1="585" y1="230" x2="345" y2="230" stroke="#34D399" stroke-width="1.5" marker-end="url(#arrowGreen2)"/>
  <line x1="340" y1="245" x2="810" y2="245" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arrowSky2)"/>
  <text x="575" y="240" fill="#38BDF8" font-family="sans-serif" font-size="10" text-anchor="middle">Announce Presence &amp; SHA-256 Fingerprint</text>

  <!-- Step 6: Pairing request -->
  <line x1="815" y1="280" x2="345" y2="280" stroke="#FBBF24" stroke-width="1.5" marker-end="url(#arrowYellow2)"/>
  <text x="575" y="273" fill="#FBBF24" font-family="sans-serif" font-size="11" text-anchor="middle">Send Pairing Request</text>

  <!-- Step 7: Display 6-digit code on host -->
  <line x1="340" y1="315" x2="120" y2="315" stroke="#FBBF24" stroke-width="1.5" marker-end="url(#arrowYellow2)"/>
  <text x="225" y="308" fill="#FBBF24" font-family="sans-serif" font-size="10" text-anchor="middle">Show 6-Digit Code Dialog</text>

  <!-- Step 8: User confirms code -->
  <line x1="115" y1="345" x2="810" y2="345" stroke="#34D399" stroke-width="1.5" marker-end="url(#arrowGreen2)"/>
  <text x="460" y="338" fill="#34D399" font-family="sans-serif" font-size="11" text-anchor="middle">3. Enter Code &amp; Click Connect</text>

  <!-- Step 9: TLS 1.3 handshake -->
  <line x1="815" y1="375" x2="345" y2="375" stroke="#34D399" stroke-width="2" marker-end="url(#arrowGreen2)"/>
  <text x="575" y="368" fill="#6EE7B7" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Mutual TLS 1.3 Handshake (AES-256-GCM)</text>

  <!-- Step 10: 60 FPS Video Stream -->
  <line x1="340" y1="410" x2="810" y2="410" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrowSky2)"/>
  <text x="575" y="403" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Stream 60 FPS Video (DXGI / NVENC)</text>

  <!-- Step 11: Fullscreen F11 -->
  <path d="M 815 425 L 850 425 L 850 440 L 820 440" fill="none" stroke="#C084FC" stroke-width="1.5" marker-end="url(#arrowPurple2)"/>
  <text x="860" y="436" fill="#C084FC" font-family="sans-serif" font-size="10">Press F11 for Fullscreen Display</text>
</svg>
