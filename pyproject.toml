[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dualdesk"
version = "0.1.0"
description = "Windows-first extended desktop prototype scaffold"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PySide6-Essentials>=6.7,<7",
  "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]
packaging = [
  "pyinstaller>=6.0,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
